<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ChatEBT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { --app-height: 100dvh; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100vh;
      height: var(--app-height);
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 700px;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 24px 14px;
      border-bottom: 1px solid #1e1e1e;
      background: #0d0d0d;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header h1 span { color: #a855f7; }

    header p {
      font-size: 0.76rem;
      color: #555;
      margin-top: 2px;
    }

    #chat-window {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 20px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .avatar.bot  { background: #7e22ce; }
    .avatar.user { background: #2a2a2a; }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.45;
      word-break: break-word;
    }

    .bubble.bot {
      background: #18101f;
      border: 1px solid #2d1b45;
      border-bottom-left-radius: 4px;
      color: #f0f0f0;
    }

    .bubble.user {
      background: #7e22ce;
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #6b21a8;
      border-radius: 50%;
      animation: tdot 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    #input-area {
      width: 100%;
      max-width: 700px;
      padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      gap: 10px;
      border-top: 1px solid #1e1e1e;
      background: #0d0d0d;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: #18101f;
      border: 1px solid #2d1b45;
      border-radius: 22px;
      color: #f0f0f0;
      font-size: 16px;
      padding: 11px 16px;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.2s;
      max-height: 110px;
      line-height: 1.4;
    }

    #user-input::placeholder { color: #4a3560; }
    #user-input:focus { border-color: #a855f7; }

    #send-btn {
      background: #7e22ce;
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      width: 46px;
      height: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      align-self: flex-end;
      -webkit-user-select: none;
      user-select: none;
    }

    #send-btn:active   { transform: scale(0.88); }
    #send-btn:disabled { background: #2a2a2a; cursor: default; }

    #chat-window::-webkit-scrollbar { display: none; }
  </style>
</head>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Say something..."></textarea>
    <button id="send-btn" aria-label="Send">&#10148;</button>

  const chatWindow = document.getElementById('chat-window');
  const userInput  = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  function syncHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }

  syncHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      syncHeight();
      requestAnimationFrame(scrollBottom);
    });
  } else {
    window.addEventListener('resize', syncHeight);
  }

  function randomResponse() {
    return RESPONSES[Math.floor(Math.random() * RESPONSES.length)];
  }

  function scrollBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function addBubble(text, role) {
    const row    = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const avatar    = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? '\u{1F92C}' : '\u{1F464}';

    const bubble    = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }

  function addTypingIndicator() {
    const row    = document.createElement('div');
    row.className = 'bubble-row';
    row.id       = 'typing-row';

    const avatar    = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = '\u{1F92C}';

    const bubble    = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function handleSend() {
    const text = userInput.value.trim();
    if (!text || sendBtn.disabled) return;

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    addBubble(text, 'user');
    addTypingIndicator();

    await new Promise(r => setTimeout(r, 700 + Math.random() * 1000));

    removeTypingIndicator();
    addBubble(randomResponse(), 'bot');
    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', handleSend);

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
  });
