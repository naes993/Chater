<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + no user-scale prevents zoom on input focus on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ChatEBT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      /* JS will set --app-height to window.visualViewport.height for keyboard handling */
      --app-height: 100dvh;
    }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      /* -apple-system ensures SF Pro on iPhone */
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100vh;
      height: var(--app-height);
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 700px;
      /* safe-area-inset-top handles the iPhone notch / Dynamic Island */
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 24px 14px;
      border-bottom: 1px solid #222;
      background: #0d0d0d;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header h1 span { color: #ff5c00; }

    header p {
      font-size: 0.76rem;
      color: #555;
      margin-top: 2px;
    }

    #chat-window {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      /* smooth momentum scroll on iOS */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 20px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .avatar.bot  { background: #ff5c00; }
    .avatar.user { background: #2a2a2a; }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 18px;
      /* 16px minimum prevents iOS input zoom later */
      font-size: 1rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .bubble.bot {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
      color: #f0f0f0;
    }

    .bubble.user {
      background: #ff5c00;
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #555;
      border-radius: 50%;
      animation: tdot 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    #input-area {
      width: 100%;
      max-width: 700px;
      /* safe-area-inset-bottom handles iPhone home indicator bar */
      padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      gap: 10px;
      border-top: 1px solid #1e1e1e;
      background: #0d0d0d;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 22px;
      color: #f0f0f0;
      /* MUST be 16px+ on iOS or keyboard causes page zoom */
      font-size: 16px;
      padding: 11px 16px;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.2s;
      max-height: 110px;
      line-height: 1.4;
    }

    #user-input::placeholder { color: #555; }
    #user-input:focus { border-color: #ff5c00; }

    #send-btn {
      background: #ff5c00;
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      width: 46px;
      height: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      align-self: flex-end;
      /* prevent callout on long-press on iOS */
      -webkit-user-select: none;
      user-select: none;
    }

    #send-btn:active  { transform: scale(0.88); }
    #send-btn:disabled { background: #2a2a2a; cursor: default; }

    /* hide scrollbar on iOS / webkit */
    #chat-window::-webkit-scrollbar { display: none; }
  </style>
</head>

  const chatWindow = document.getElementById('chat-window');
  const userInput  = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const app        = document.getElementById('app');

  // ── iOS visual viewport / keyboard fix ──────────────────
  function syncHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }

  syncHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      syncHeight();
      // scroll chat to bottom after keyboard slides in
      requestAnimationFrame(scrollBottom);
    });
  } else {
    window.addEventListener('resize', syncHeight);
  }
  // ────────────────────────────────────────────────────────

  function randomResponse() {
    return RESPONSES[Math.floor(Math.random() * RESPONSES.length)];
  }

  function scrollBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function addBubble(text, role) {
    const row    = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const avatar    = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? '\u{1F92C}' : '\u{1F464}';

    const bubble    = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }

  function addTypingIndicator() {
    const row    = document.createElement('div');
    row.className = 'bubble-row';
    row.id       = 'typing-row';

    const avatar    = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = '\u{1F92C}';

    const bubble    = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function handleSend() {
    const text = userInput.value.trim();
    if (!text || sendBtn.disabled) return;

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    addBubble(text, 'user');
    addTypingIndicator();

    const delay = 700 + Math.random() * 1000;
    await new Promise(r => setTimeout(r, delay));

    removeTypingIndicator();
    addBubble(randomResponse(), 'bot');
    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', handleSend);

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
  });
