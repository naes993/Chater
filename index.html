<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ChatEBT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      --app-height: 100dvh;
      --accent:       #7e22ce;
      --accent-light: #a855f7;
      --accent-bg:    #18101f;
      --accent-border:#2d1b45;
    }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      display: flex;
      width: 100%;
      height: 100vh;
      height: var(--app-height);
      overflow: hidden;
    }

    /* ─── SIDEBAR ───────────────────────────────────────────── */
    #sidebar {
      width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1a1a1a;
      background: #0d0d0d;
    }

    #sidebar-header {
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #sidebar-header h1 {
      flex: 1;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    #sidebar-header h1 span { color: #a855f7; }

    #add-btn {
      background: #7e22ce;
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.4rem;
      width: 36px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      line-height: 1;
      -webkit-user-select: none; user-select: none;
    }
    #add-btn:active { background: #a855f7; transform: scale(0.92); }

    #contacts-list { flex: 1; overflow-y: auto; }
    #contacts-list::-webkit-scrollbar { display: none; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid #141414;
      transition: background 0.15s;
      -webkit-user-select: none; user-select: none;
    }
    .contact-item:active { background: #181818; }
    .contact-item.active {
      background: #18101f;
      border-left: 3px solid #a855f7;
      padding-left: 13px;
    }

    .contact-avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-weight: 600; font-size: 0.95rem; color: #f0f0f0; }
    .contact-preview {
      font-size: 0.78rem;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    /* ─── CHAT AREA ─────────────────────────────────────────── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #chat-header {
      width: 100%;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      border-bottom: 1px solid #1a1a1a;
      background: #0d0d0d;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--accent-light);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 2px 10px 2px 0;
      line-height: 1;
      -webkit-user-select: none; user-select: none;
    }

    #chat-header-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .header-text { flex: 1; min-width: 0; }
    #active-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      display: block;
      line-height: 1.2;
    }
    #active-subtitle { font-size: 0.7rem; color: #555; }

    #reset-btn {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      color: #666;
      font-size: 1rem;
      padding: 6px 9px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s;
      -webkit-user-select: none; user-select: none;
    }
    #reset-btn:active { color: #fff; border-color: #555; }

    /* ─── EMPTY STATE ───────────────────────────────────────── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #2a2a2a;
      text-align: center;
      padding: 24px;
    }
    #empty-state .icon { font-size: 3rem; }
    #empty-state p { font-size: 0.9rem; color: #333; line-height: 1.5; }

    /* ─── MESSAGES ──────────────────────────────────────────── */
    #chat-window {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 20px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #chat-window::-webkit-scrollbar { display: none; }

    .bubble-row { display: flex; align-items: flex-end; gap: 8px; }
    .bubble-row.user { flex-direction: row-reverse; }

    .av {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: var(--accent);
    }
    .av.user-av { background: #2a2a2a; }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.45;
      word-break: break-word;
    }
    .bubble.bot {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-bottom-left-radius: 4px;
      color: #f0f0f0;
    }
    .bubble.user {
      background: var(--accent);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .typing-dots { display: flex; gap: 5px; padding: 4px 2px; }
    .typing-dots span {
      width: 8px; height: 8px;
      background: var(--accent-light);
      border-radius: 50%;
      animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,60%,100% { transform: translateY(0); opacity:.5; }
      30%          { transform: translateY(-6px); opacity:1; }
    }

    /* ─── INPUT ─────────────────────────────────────────────── */
    #input-area {
      width: 100%;
      padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      gap: 10px;
      border-top: 1px solid #1a1a1a;
      background: #0d0d0d;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 22px;
      color: #f0f0f0;
      font-size: 16px;
      padding: 11px 16px;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.2s;
      max-height: 110px;
      line-height: 1.4;
    }
    #user-input::placeholder { color: #4a3560; }
    #user-input:focus { border-color: var(--accent-light); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      width: 46px; height: 46px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      align-self: flex-end;
      -webkit-user-select: none; user-select: none;
    }
    #send-btn:active   { transform: scale(0.88); }
    #send-btn:disabled { background: #2a2a2a; cursor: default; }

    /* ─── TOAST ─────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1e1e1e;
      border: 1px solid #333;
      color: #f0f0f0;
      font-size: 0.82rem;
      padding: 9px 16px;
      border-radius: 20px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
    }
    #toast.show  { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: #7f1d1d; color: #fca5a5; }

    /* ─── MOBILE ────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #sidebar { width: 100%; }
      #back-btn { display: flex; align-items: center; }

      #app.show-sidebar #sidebar   { display: flex; }
      #app.show-sidebar #chat-area { display: none; }
      #app.show-chat    #sidebar   { display: none; }
      #app.show-chat    #chat-area { display: flex; }
    }
  </style>
</head>
<body>
<div id="app" class="show-sidebar">

  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>Chat<span>EBT</span></h1>
      <button id="add-btn" title="Load personality JSON">+</button>
      <input type="file" id="file-input" accept=".json" style="display:none" />
    </div>
    <div id="contacts-list"></div>
  </aside>

  <main id="chat-area">
    <header id="chat-header">
      <button id="back-btn">&#8592;</button>
      <div id="chat-header-avatar"></div>
      <div class="header-text">
        <span id="active-name"></span>
        <span id="active-subtitle">active now</span>
      </div>
      <button id="reset-btn" title="Clear this chat">&#x21BA;</button>
    </header>
    <div id="chat-window"></div>
    <div id="input-area">
      <textarea id="user-input" rows="1" placeholder="Say something..."></textarea>
      <button id="send-btn">&#10148;</button>
    </div>
  </main>

</div>
<div id="toast"></div>

  // sessions: [{ id, personality, messages: [{role, text}], pending }]
  let sessions = [];
  let activeSessionId = null;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ── DOM refs ────────────────────────────────────────────────
  const appEl         = document.getElementById('app');
  const contactsList  = document.getElementById('contacts-list');
  const chatWindow    = document.getElementById('chat-window');
  const userInput     = document.getElementById('user-input');
  const sendBtn       = document.getElementById('send-btn');
  const resetBtn      = document.getElementById('reset-btn');
  const addBtn        = document.getElementById('add-btn');
  const fileInput     = document.getElementById('file-input');
  const backBtn       = document.getElementById('back-btn');
  const headerAvatar  = document.getElementById('chat-header-avatar');
  const activeName    = document.getElementById('active-name');
  const toast         = document.getElementById('toast');

  // ── viewport height fix ─────────────────────────────────────
  function syncHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  syncHeight();
  (window.visualViewport || window).addEventListener('resize', () => {
    syncHeight();
    requestAnimationFrame(scrollBottom);
  });

  // ── audio ────────────────────────────────────────────────────
  let audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playChirp() {
    if (!audioCtx) return;
    try {
      const ctx = audioCtx, t = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(3400, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.2, t + 0.003);
      gain.gain.setValueAtTime(0.2, t + 0.07);
      gain.gain.linearRampToValueAtTime(0, t + 0.08);
      osc.start(t); osc.stop(t + 0.09);
    } catch (e) {}
  }

  // ── toast ────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, isError = false) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className   = 'show' + (isError ? ' error' : '');
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }

  // ── contacts list ────────────────────────────────────────────
  function renderContacts() {
    contactsList.innerHTML = '';
    sessions.forEach(session => {
      const last    = session.messages[session.messages.length - 1];
      const preview = last ? last.text : 'No messages yet';
      const p       = session.personality;

      const item = document.createElement('div');
      item.className = 'contact-item' + (session.id === activeSessionId ? ' active' : '');
      item.innerHTML =
        `<div class="contact-avatar" style="background:${p.accentColor || '#7e22ce'}">${p.avatar}</div>` +
        `<div class="contact-info">` +
          `<div class="contact-name">${p.name}</div>` +
          `<div class="contact-preview">${preview.slice(0, 50)}</div>` +
        `</div>`;
      item.addEventListener('click', () => selectSession(session.id));
      contactsList.appendChild(item);
    });
  }

  // ── select / switch session ──────────────────────────────────
  function selectSession(id) {
    activeSessionId = id;
    const session = sessions.find(s => s.id === id);
    if (!session) return;

    const p    = session.personality;
    const root = document.documentElement;
    root.style.setProperty('--accent',        p.accentColor  || DEFAULT_PERSONALITY.accentColor);
    root.style.setProperty('--accent-light',  p.accentLight  || DEFAULT_PERSONALITY.accentLight);
    root.style.setProperty('--accent-bg',     p.accentBg     || DEFAULT_PERSONALITY.accentBg);
    root.style.setProperty('--accent-border', p.accentBorder || DEFAULT_PERSONALITY.accentBorder);

    headerAvatar.textContent = p.avatar;
    headerAvatar.style.background = p.accentColor || DEFAULT_PERSONALITY.accentColor;
    activeName.textContent = p.name;

    renderChatMessages(session);
    renderContacts();
    syncInputState();

    appEl.className = 'show-chat';
    userInput.focus();
  }

  // ── render messages ──────────────────────────────────────────
  function renderChatMessages(session) {
    chatWindow.innerHTML = '';
    session.messages.forEach(msg => renderBubble(msg.text, msg.role, session.personality));
    if (session.pending) addTypingIndicator(session.personality);
    scrollBottom();
  }

  // ── add a message to a session (model + DOM if it's on screen) ─
  function addMessage(session, role, text) {
    session.messages.push({ role, text });
    if (session.id === activeSessionId) renderBubble(text, role, session.personality);
    renderContacts();
  }

  // ── render one bubble into the chat window (no model change) ──
  function renderBubble(text, role, personality) {
    const p   = personality || DEFAULT_PERSONALITY;
    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const av = document.createElement('div');
    av.className = role === 'bot' ? 'av' : 'av user-av';
    av.textContent = role === 'bot' ? p.avatar : '\u{1F464}';
    if (role === 'bot') av.style.background = p.accentColor || DEFAULT_PERSONALITY.accentColor;

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;

    row.appendChild(av);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }

  // ── typing indicator ─────────────────────────────────────────
  function addTypingIndicator(p) {
    const row = document.createElement('div');
    row.className = 'bubble-row bot';
    row.id = 'typing-row';
    const av = document.createElement('div');
    av.className = 'av';
    av.textContent = p.avatar;
    av.style.background = p.accentColor || DEFAULT_PERSONALITY.accentColor;
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(av);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }
  function removeTypingIndicator() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function scrollBottom() { chatWindow.scrollTop = chatWindow.scrollHeight; }

  // Send button is disabled only while the CURRENTLY OPEN session is awaiting
  // a reply — a different session typing in the background must not lock input.
  function syncInputState() {
    const session = sessions.find(s => s.id === activeSessionId);
    sendBtn.disabled = !session || !!session.pending;
  }

  // ── send message ─────────────────────────────────────────────
  async function handleSend() {
    const session = sessions.find(s => s.id === activeSessionId);
    if (!session || session.pending) return;
    const text = userInput.value.trim();
    if (!text) return;
    unlockAudio();

    userInput.value = '';
    userInput.style.height = 'auto';

    addMessage(session, 'user', text);
    session.pending = true;
    syncInputState();
    if (session.id === activeSessionId) addTypingIndicator(session.personality);

    await new Promise(r => setTimeout(r, 700 + Math.random() * 1000));

    session.pending = false;
    if (session.id === activeSessionId) removeTypingIndicator();

    const pool = session.personality.responses;
    const reply = pool[Math.floor(Math.random() * pool.length)];
    addMessage(session, 'bot', reply);
    if (session.id === activeSessionId) { playChirp(); syncInputState(); userInput.focus(); }
  }

  // ── reset active session ─────────────────────────────────────
  function resetActiveSession() {
    const session = sessions.find(s => s.id === activeSessionId);
    if (!session) return;
    removeTypingIndicator();
    session.pending = false;
    const greeting = session.personality.greeting || DEFAULT_PERSONALITY.greeting;
    session.messages = [{ role: 'bot', text: greeting }];
    renderChatMessages(session);
    renderContacts();
    syncInputState();
    showToast('\u{1F504} Chat cleared');
  }

  // ── upload personality JSON ──────────────────────────────────
  function loadPersonalityFile(file) {
    if (!file) return;
    fileInput.value = '';
    const reader = new FileReader();
    reader.onload = e => {
      let parsed;
      try { parsed = JSON.parse(e.target.result); }
      catch { showToast('⚠️ Invalid JSON file.', true); return; }
      if (!Array.isArray(parsed.responses) || parsed.responses.length === 0) {
        showToast('⚠️ JSON needs a non-empty “responses” array.', true);
        return;
      }
      const p = { ...DEFAULT_PERSONALITY, ...parsed };
      const session = {
        id: uid(),
        personality: p,
        messages: [{ role: 'bot', text: p.greeting || DEFAULT_PERSONALITY.greeting }]
      };
      sessions.push(session);
      renderContacts();
      selectSession(session.id);
      showToast('✅ Added: ' + p.name);
    };
    reader.readAsText(file);
  }

  // ── event listeners ──────────────────────────────────────────
  addBtn.addEventListener('click',  () => fileInput.click());
  fileInput.addEventListener('change', () => loadPersonalityFile(fileInput.files[0]));
  resetBtn.addEventListener('click', resetActiveSession);
  backBtn.addEventListener('click',  () => { appEl.className = 'show-sidebar'; });
  sendBtn.addEventListener('click',  handleSend);
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
  });

  // ── init ─────────────────────────────────────────────────────
  (function init() {
    const ebt = {
      id: 'ebt',
      personality: { ...DEFAULT_PERSONALITY },
      messages: [{ role: 'bot', text: DEFAULT_PERSONALITY.greeting }]
    };
    sessions.push(ebt);
    renderContacts();
    // Auto-open on desktop; mobile stays on contacts list
    if (window.innerWidth > 640) selectSession('ebt');
  })();
</script>
</body>
</html>
