<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ChatEBT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      --app-height: 100dvh;
      --accent:       #7e22ce;
      --accent-light: #a855f7;
      --accent-bg:    #18101f;
      --accent-border:#2d1b45;
    }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100vh;
      height: var(--app-height);
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 700px;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
      border-bottom: 1px solid #1e1e1e;
      background: #0d0d0d;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-text { flex: 1; min-width: 0; }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header h1 span { color: var(--accent-light); }

    header p {
      font-size: 0.73rem;
      color: #555;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-btn {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      color: #aaa;
      font-size: 0.72rem;
      padding: 7px 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s;
      -webkit-user-select: none;
      user-select: none;
      line-height: 1;
    }

    .header-btn:active { color: #fff; border-color: var(--accent-light); }

    #reset-btn { font-size: 1rem; padding: 6px 9px; color: #666; }
    #reset-btn:active { color: #fff; border-color: #555; }

    #chat-window {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 20px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row { display: flex; align-items: flex-end; gap: 8px; }
    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: var(--accent);
      transition: background 0.3s;
    }
    .avatar.user { background: #2a2a2a; }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.45;
      word-break: break-word;
    }

    .bubble.bot {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-bottom-left-radius: 4px;
      color: #f0f0f0;
      transition: background 0.3s, border-color 0.3s;
    }

    .bubble.user {
      background: var(--accent);
      border-bottom-right-radius: 4px;
      color: #fff;
      transition: background 0.3s;
    }

    .typing-dots { display: flex; gap: 5px; padding: 4px 2px; }
    .typing-dots span {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,60%,100% { transform: translateY(0); opacity:.5; }
      30%          { transform: translateY(-6px); opacity:1; }
    }

    #input-area {
      width: 100%;
      max-width: 700px;
      padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      gap: 10px;
      border-top: 1px solid #1e1e1e;
      background: #0d0d0d;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 22px;
      color: #f0f0f0;
      font-size: 16px;
      padding: 11px 16px;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.2s;
      max-height: 110px;
      line-height: 1.4;
    }
    #user-input::placeholder { color: #4a3560; }
    #user-input:focus { border-color: var(--accent-light); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      width: 46px; height: 46px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      align-self: flex-end;
      -webkit-user-select: none;
      user-select: none;
    }
    #send-btn:active   { transform: scale(0.88); }
    #send-btn:disabled { background: #2a2a2a; cursor: default; }

    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1e1e1e;
      border: 1px solid #333;
      color: #f0f0f0;
      font-size: 0.82rem;
      padding: 9px 16px;
      border-radius: 20px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
    }
    #toast.show  { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: #7f1d1d; color: #fca5a5; }

    #chat-window::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-text">
      <h1>Chat<span id="bot-name">EBT</span></h1>
      <p>powered by pure unfiltered energy &#9889;</p>
    </div>
    <button id="reset-btn"  class="header-btn" aria-label="Reset chat">&#x21BA;</button>
    <button id="upload-btn" class="header-btn" aria-label="Upload personality">&#128100; Load</button>
    <input type="file" id="file-input" accept=".json" style="display:none" />
  </header>

  <div id="chat-window"></div>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Say something..."></textarea>
    <button id="send-btn" aria-label="Send">&#10148;</button>

</div>
<div id="toast"></div>

<script>

  let personality = { ...DEFAULT_PERSONALITY };

  // ── DOM refs ─────────────────────────────────────────────────
  const chatWindow = document.getElementById('chat-window');
  const userInput  = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const uploadBtn  = document.getElementById('upload-btn');
  const resetBtn   = document.getElementById('reset-btn');
  const fileInput  = document.getElementById('file-input');
  const toast      = document.getElementById('toast');
  const botNameEl  = document.getElementById('bot-name');

  // ── iOS viewport fix ─────────────────────────────────────────
  function syncHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  syncHeight();
  (window.visualViewport || window).addEventListener('resize', () => {
    syncHeight();
    requestAnimationFrame(scrollBottom);
  });

  // ── smoke detector chirp (Web Audio API) ──────────────────────
  let audioCtx = null;

  // Must be called inside a user-gesture handler to satisfy iOS autoplay policy
  function unlockAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playChirp() {
    if (!audioCtx) return;
    try {
      const ctx = audioCtx;
      const t   = ctx.currentTime;

      function beep(startTime, freq, duration) {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, startTime);
        // slight frequency drop at end, like a real detector
        osc.frequency.linearRampToValueAtTime(freq * 0.92, startTime + duration);

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.18, startTime + 0.004); // fast attack
        gain.gain.setValueAtTime(0.18, startTime + duration - 0.012);
        gain.gain.linearRampToValueAtTime(0, startTime + duration); // fast decay

        osc.start(startTime);
        osc.stop(startTime + duration + 0.01);
      }

      // two-pulse chirp: main beep then a tiny echo, like a real smoke detector
      beep(t,        3400, 0.07);
      beep(t + 0.11, 3400, 0.04);
    } catch (e) { /* silently ignore if audio fails */ }
  }

  // ── toast ─────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, isError = false) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className   = 'show' + (isError ? ' error' : '');
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }

  // ── apply personality ───────────────────────────────────────────
  function applyPersonality(p) {
    const root = document.documentElement;
    root.style.setProperty('--accent',        p.accentColor  || DEFAULT_PERSONALITY.accentColor);
    root.style.setProperty('--accent-light',  p.accentLight  || DEFAULT_PERSONALITY.accentLight);
    root.style.setProperty('--accent-bg',     p.accentBg     || DEFAULT_PERSONALITY.accentBg);
    root.style.setProperty('--accent-border', p.accentBorder || DEFAULT_PERSONALITY.accentBorder);
    botNameEl.textContent = p.name || DEFAULT_PERSONALITY.name;
    document.querySelectorAll('.avatar.bot').forEach(el => {
      el.textContent = p.avatar || DEFAULT_PERSONALITY.avatar;
    });
  }

  // ── reset ─────────────────────────────────────────────────────
  function resetChat() {
    personality = { ...DEFAULT_PERSONALITY };
    applyPersonality(personality);
    removeTypingIndicator();
    chatWindow.innerHTML = '';
    sendBtn.disabled = false;
    userInput.value = '';
    userInput.style.height = 'auto';
    addBubble(DEFAULT_PERSONALITY.greeting, 'bot');
    showToast('\u{1F504} Chat reset');
  }

  resetBtn.addEventListener('click', resetChat);

  // ── JSON upload ───────────────────────────────────────────────
  uploadBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileInput.value = '';
    const reader = new FileReader();
    reader.onload = e => {
      let parsed;
      try { parsed = JSON.parse(e.target.result); }
      catch { showToast('⚠️ Invalid JSON file.', true); return; }

      if (!Array.isArray(parsed.responses) || parsed.responses.length === 0) {
        showToast('⚠️ JSON needs a non-empty "responses" array.', true);
        return;
      }

      personality = { ...DEFAULT_PERSONALITY, ...parsed };
      applyPersonality(personality);
      if (parsed.greeting) addBubble(parsed.greeting, 'bot');
      showToast('✅ Loaded: ' + (parsed.name || 'Custom'));
    };
    reader.readAsText(file);
  });

  // ── chat helpers ──────────────────────────────────────────────
  function scrollBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function addBubble(text, role) {
    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;
    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? (personality.avatar || DEFAULT_PERSONALITY.avatar) : '\u{1F464}';
    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'bubble-row';
    row.id = 'typing-row';
    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = personality.avatar || DEFAULT_PERSONALITY.avatar;
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollBottom();
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  // ── send ──────────────────────────────────────────────────────
  async function handleSend() {
    const text = userInput.value.trim();
    if (!text || sendBtn.disabled) return;

    unlockAudio(); // must happen inside user gesture for iOS

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    addBubble(text, 'user');
    addTypingIndicator();

    await new Promise(r => setTimeout(r, 700 + Math.random() * 1000));

    removeTypingIndicator();
    const pool = personality.responses;
    addBubble(pool[Math.floor(Math.random() * pool.length)], 'bot');
    playChirp(); // BEEP
    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', handleSend);

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
  });

  // init
  addBubble(DEFAULT_PERSONALITY.greeting, 'bot');
</script>
