<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chirp Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, system-ui, sans-serif;
      padding: calc(env(safe-area-inset-top,0px) + 32px) 24px calc(env(safe-area-inset-bottom,0px) + 32px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100dvh;
    }
    h1 { font-size: 1.3rem; font-weight: 800; color: #a855f7; margin-bottom: 4px; }
    p  { font-size: 0.8rem; color: #555; margin-bottom: 8px; }
    .btn {
      background: #18101f;
      border: 1px solid #2d1b45;
      border-radius: 14px;
      color: #f0f0f0;
      font-size: 1rem;
      padding: 18px 20px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { background: #2d1b45; border-color: #a855f7; }
    .btn .label { font-weight: 700; display: block; margin-bottom: 3px; }
    .btn .desc  { font-size: 0.78rem; color: #777; }
  </style>
</head>
<body>
  <h1>&#128266; Chirp Test</h1>
  <p>Tap each button. Tell me which one sounds right.</p>

  <button class="btn" onclick="play(1)">
    <span class="label">A &mdash; Single flat beep</span>
    <span class="desc">One clean 3400 Hz square wave, 80ms</span>
  </button>

  <button class="btn" onclick="play(2)">
    <span class="label">B &mdash; Double chirp</span>
    <span class="desc">Two short pips in quick succession</span>
  </button>

  <button class="btn" onclick="play(3)">
    <span class="label">C &mdash; Sharp single with drop</span>
    <span class="desc">High-pitched, frequency falls at the end like a dying battery</span>
  </button>

  <button class="btn" onclick="play(4)">
    <span class="label">D &mdash; Three-pulse stutter</span>
    <span class="desc">Rapid triple beep, very short gaps</span>
  </button>

  <button class="btn" onclick="play(5)">
    <span class="label">E &mdash; Buzzy / harsh</span>
    <span class="desc">Sawtooth wave, grittier tone</span>
  </button>

  <button class="btn" onclick="play(6)">
    <span class="label">F &mdash; Ascending pip</span>
    <span class="desc">Frequency sweeps up quickly, like a piezo alarm</span>
  </button>

<script>
  let ctx = null;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function beep(startTime, freq, endFreq, duration, waveType, volume) {
    const c    = getCtx();
    const osc  = c.createOscillator();
    const gain = c.createGain();
    osc.connect(gain);
    gain.connect(c.destination);
    osc.type = waveType || 'square';
    osc.frequency.setValueAtTime(freq, startTime);
    if (endFreq !== freq) {
      osc.frequency.linearRampToValueAtTime(endFreq, startTime + duration);
    }
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(volume || 0.2, startTime + 0.003);
    gain.gain.setValueAtTime(volume || 0.2, startTime + duration - 0.01);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.01);
  }

  function play(n) {
    const c = getCtx();
    const t = c.currentTime;

    if (n === 1) {
      // A: single flat beep
      beep(t, 3400, 3400, 0.08, 'square', 0.2);
    }
    else if (n === 2) {
      // B: double chirp
      beep(t,       3400, 3400, 0.06, 'square', 0.2);
      beep(t + 0.1, 3400, 3400, 0.06, 'square', 0.2);
    }
    else if (n === 3) {
      // C: single with steep frequency drop at end
      beep(t, 3800, 2600, 0.09, 'square', 0.22);
    }
    else if (n === 4) {
      // D: three-pulse stutter
      beep(t,        3400, 3400, 0.04, 'square', 0.2);
      beep(t + 0.07, 3400, 3400, 0.04, 'square', 0.2);
      beep(t + 0.14, 3400, 3400, 0.04, 'square', 0.2);
    }
    else if (n === 5) {
      // E: buzzy sawtooth
      beep(t, 3200, 3200, 0.09, 'sawtooth', 0.15);
    }
    else if (n === 6) {
      // F: ascending piezo sweep
      beep(t, 2800, 4200, 0.08, 'square', 0.2);
    }
  }
</script>
</body>
</html>
